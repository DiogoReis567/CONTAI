
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de login com suporte a tema escuro e claro">
    <title>Login - Tema Dinâmico</title>
    <link rel="stylesheet" href="../STYLE/login.css">
    
    <style>
        /* Variáveis CSS para temas */
        :root {
            --bg-primary: #FCFCFA;
            --bg-secondary: #FFFFFF;
            --text-primary: #0D1D25;
            --text-secondary: #324A54;
            --cta-color: #54C6C7;
            --border-color: #E0E0E0;
        }

        /* Tema Escuro */
        html[data-theme="dark"] {
            --bg-primary: #01131F;
            --bg-secondary: #021929;
            --text-primary: #FFFFFF;
            --text-secondary: #BDB8BA;
            --cta-color: #05ECBD;
            --border-color: #0D2D3F;
        }

        /* Reset e estilos globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ========================================
           HEADER - Botão Toggle de Tema
           ======================================== */
        .header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 20px;
            z-index: 1000;
        }

        .theme-toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg-secondary);
            border: 2px solid var(--cta-color);
            color: var(--cta-color);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--cta-color);
        }

        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        /* ========================================
           CONTAINER PRINCIPAL - Login
           ======================================== */
        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           TÍTULO E SUBTÍTULO
           ======================================== */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ========================================
           FORMULÁRIO DE LOGIN
           ======================================== */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .form-group input {
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cta-color);
            box-shadow: 0 0 0 3px rgba(84, 198, 199, 0.1);
        }

        html[data-theme="dark"] .form-group input:focus {
            box-shadow: 0 0 0 3px rgba(5, 236, 189, 0.1);
        }

        /* ========================================
           BOTÃO DE LOGIN (CTA)
           ======================================== */
        .login-btn {
            padding: 12px 16px;
            background-color: var(--cta-color);
            color: #01131F;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            font-family: inherit;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(84, 198, 199, 0.3);
        }

        html[data-theme="dark"] .login-btn:hover {
            box-shadow: 0 8px 16px rgba(5, 236, 189, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ========================================
           LINKS SECUNDÁRIOS
           ======================================== */
        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 20px;
            gap: 10px;
        }

        .login-footer a {
            color: var(--cta-color);
            text-decoration: none;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }

        .login-footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .forgot-password {
            flex: 1;
            text-align: left;
        }

        .signup-link {
            flex: 1;
            text-align: right;
        }

        .divider {
            width: 1px;
            height: 14px;
            background-color: var(--text-secondary);
            opacity: 0.3;
        }

        /* ========================================
           RESPONSIVIDADE
           ======================================== */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px;
                max-width: 100%;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-footer {
                flex-direction: column;
                gap: 12px;
            }

            .forgot-password,
            .signup-link {
                text-align: center;
                flex: none;
            }

            .divider {
                display: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .header {
                padding: 16px;
            }

            .login-container {
                padding: 24px;
                border-radius: 8px;
            }

            .login-header h1 {
                font-size: 20px;
            }

            .form-group input {
                padding: 10px 12px;
                font-size: 16px; /* Previne zoom automático em iOS */
            }
        }
    </style>
</head>
<body>
    <!-- ========================================
         HEADER - Botão Toggle de Tema
         ======================================== -->
    <header class="header">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Alternar tema">
            <span id="themeIcon">🌙</span>
        </button>
    </header>

    <!-- ========================================
         CONTAINER PRINCIPAL - Formulário de Login
         ======================================== -->
    <main class="login-container">
        <!-- Título -->
        <section class="login-header">
            <h1>Bem-vindo</h1>
            <p>Faça login para continuar</p>
        </section>

        <!-- Formulário -->
        <form class="login-form" id="loginForm">
            <!-- Campo de Email/Usuário -->
            <div class="form-group">
                <label for="email">Email ou Usuário</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com"
                    required
                    autocomplete="email"
                >
            </div>

            <!-- Campo de Senha -->
            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <!-- Botão de Login -->
            <button type="submit" class="login-btn">Entrar</button>
        </form>

        <!-- Links Secundários -->
        <footer class="login-footer">
            <a href="ajuda.html" class="forgot-password">Esqueci minha senha</a>
            <span class="divider"></span>
            <a href="cadastro.html" class="signup-link">Criar conta</a>
        </footer>
    </main>

    <!-- ========================================
         SCRIPT - Funcionalidade de Toggle de Tema
         ======================================== -->
    <script>
        // Elementos do DOM
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Tema padrão (claro)
        const DEFAULT_THEME = 'light';
        const STORAGE_KEY = 'theme-preference';

        /**
         * Inicializa o tema ao carregar a página
         * Verifica localStorage ou usa tema padrão
         */
        function initializeTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
            setTheme(savedTheme);
        }

        /**
         * Define o tema da página
         * @param {string} theme - 'light' ou 'dark'
         */
        function setTheme(theme) {
            const isLight = theme === 'light';
            
            // Atualiza o atributo data-theme do HTML
            htmlElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
            
            // Atualiza o ícone
            themeIcon.textContent = isLight ? '🌙' : '☀️';
            
            // Salva a preferência no localStorage
            localStorage.setItem(STORAGE_KEY, theme);
        }

        /**
         * Alterna entre tema claro e escuro
         */
        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        // Event Listeners
        themeToggle.addEventListener('click', toggleTheme);

        // Inicializa o tema ao carregar a página
        document.addEventListener('DOMContentLoaded', initializeTheme);

        // Detecta preferência do sistema (opcional - comentado)
        // Descomente a linha abaixo para respeitar a preferência do SO
        // const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // const initialTheme = localStorage.getItem(STORAGE_KEY) || (prefersDark ? 'dark' : 'light');

        //     const password = document.getElementById('password').value;
        //     console.log('Email:', email, 'Password:', password);
        //     // Aqui você adicionaria a lógica de autenticação
        // });
    </script>
</body>
</html>
